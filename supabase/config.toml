[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54324
api_url = "http://127.0.0.1:54321"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_expiry = 3600

# Edge Functions
[functions.calendar-oauth-start]
verify_jwt = true

[functions.calendar-oauth-callback]
verify_jwt = true

[functions.calendar-sync]
verify_jwt = true

[functions.gmail-compose]
verify_jwt = true

# Google Cloud Pub/Sub cannot attach a Supabase user JWT. The function keeps
# gateway verification off so it can validate Google's signed OIDC JWT itself;
# every user/scheduler control request is separately authenticated in-handler.
[functions.gmail-watch]
verify_jwt = false

[functions.watch-renewal-cron]
verify_jwt = true

# Google cannot attach a Supabase JWT to Calendar push notifications. The
# handler verifies Google channel callbacks with a dedicated HMAC token and
# separately authenticates every control request.
[functions.calendar-watch]
verify_jwt = false
