name: Calendar operation receipt contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  calendar-operation-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install disposable-test PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16
      - name: Verify exact receipts and real local concurrency
        run: npm run test:calendar:receipts
        env:
          MIND_MANUAL_TEST_PG_BIN: /usr/lib/postgresql/16/bin
