name: Current UI smoke gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  current-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run current-route smoke gate
        run: npm run test:e2e:ci
        env:
          CI: true

      - name: Verify real browser local save commits and aborts
        run: npm run test:storage-browser

      - name: Verify isolated builds stop on shared or copied origins
        run: npm run test:deployment:browser

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: current-ui-smoke-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
