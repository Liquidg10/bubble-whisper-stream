name: Accessibility and quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  accessibility-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check inherited Assistant cohesion debt ratchet
        run: npm run lint:cohesion:ratchet

      - name: Check inherited ESLint debt ratchet
        run: npm run lint:ratchet

      - name: TypeScript
        run: npm run typecheck

      - name: Run bounded unit and integration gate
        run: npm run test:unit:ci

      - name: Verify owned Calendar imports and reviewed saved-link recovery
        run: npm run test:isolation:calendar-sync

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded accessibility release gate
        run: npm run test:a11y:ci
        env:
          CI: true

      - name: Upload accessibility evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
